# agentic-shopping.flyreelstudio.eu — static Next.js export (4 locales) + /api/lead proxy.
# Container nginx: any conf change on the bind-mount => `docker restart agentic-shopping-web`
# (sed/scp breaks the inode; reload won't see it).

# gzip is OFF by default in nginx:alpine — essential for Next chunks
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

# ---- locale detection (playbook §1): remembered choice (cookie) beats browser language,
# browser language beats the EN default. Only for the bare "/" — deep links keep their locale.
map $http_accept_language $asa_browser_lang {
    default en;
    "~*^\s*es"       es;
    "~*^\s*pl"       pl;
    "~*^\s*(ru|uk|be)" ru;
}
map $cookie_asa_lang $asa_cookie_lang {
    default "";
    ~^(en|es|pl|ru)$ $1;
}
map "$asa_cookie_lang:$asa_browser_lang" $asa_lang {
    default $asa_browser_lang;
    "~^(?<c>en|es|pl|ru):" $c;
}

server {
    listen 80;
    server_name agentic-shopping.flyreelstudio.eu;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # long cache for hashed Next assets, short for HTML
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = / { return 302 /$asa_lang/; }

    location / {
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ $uri.html /404.html;
    }

    # ---- lead form -> own form container (never reaches the host network)
    location = /api/lead {
        proxy_pass http://agentic-shopping-form:8089/api/lead;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 32k;
    }
    location = /api/health {
        proxy_pass http://agentic-shopping-form:8089/api/health;
    }
}
