# First run only: ACME staging dry-run to protect the Let's Encrypt rate limits
# (5 duplicate certs/week, 5 failures/hour). Usage:
#   docker compose -f docker-compose.yml -f compose.staging.yml up -d
# then verify routing through the proxy, then:
#   docker compose -f docker-compose.yml up -d --force-recreate agentic-shopping-web
services:
  agentic-shopping-web:
    environment:
      - LETSENCRYPT_TEST=true
